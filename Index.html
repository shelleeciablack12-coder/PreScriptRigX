<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PreScriptRigX - Study Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>PreScriptRigX Study Hub</h1>
  </header>

  <main id="app" class="container">
    <section id="home" class="home-view">
      <h2>Main Subjects</h2>
      <div id="subjectsGrid" class="grid"></div>
    </section>

    <section id="subjectView" class="subject-view hidden">
      <div class="subject-top">
        <button id="backHome" class="btn small">&larr; Home</button>
        <h2 id="subjectTitle"></h2>
      </div>

      <div class="sections">
        <div id="sectionSelection" class="section-selection">
          <button class="btn big" data-section="notes">Study Source</button>
          <button class="btn big" data-section="pastPapers">Past Papers</button>
          <button class="btn big" data-section="pastPapersAnswers">Past Papers with Answers</button>
        </div>

        <div id="panelArea" class="panel hidden">
          <div class="file-panel">
            <input id="searchInput" class="search-input" type="search" placeholder="Search files..." aria-label="Search files" />
            <aside id="fileList" class="file-list"></aside>
          </div>
          <article id="fileContent" class="file-content"></article>
        </div>
      </div>
    </section>
  </main>

  <script src="./vendor/pdfjs/pdf.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
